scripts:
  - type: afterResponse
    code: "const requestBody = pm.request.body.raw;\r

      const jsonData = JSON.parse(requestBody);\r

      const secretKey = \"Test_217O00440\";\r

      const minifiedBody = JSON.stringify(jsonData);\r

      const hash = CryptoJS.HmacSHA256(minifiedBody, secretKey);\r

      const hmacSignature = hash.toString(CryptoJS.enc.Hex);\r

      pm.request.headers.add({\r

      \    key: 'X-Signature-256',\r

      \    value: hmacSignature\r

      });"
