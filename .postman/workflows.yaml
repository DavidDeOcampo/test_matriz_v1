      options:
        syncExamples: false
        deleteOrphanedRequests: false
    - spec: ../postman/specs/Texting/Texting.json
      collection: ../postman/collections/tests_matriz_v1
      options:
        syncExamples: false
        deleteOrphanedRequests: false
  syncCollectionToSpec:
